<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Чайка17</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: Georgia, serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, lw = 0, lh = 0, dpr = 1;

  const logoImg = new Image();
  let logoLoaded = false;
  logoImg.onload = function() { logoLoaded = true; };
  logoImg.onerror = function() { logoLoaded = false; };
  logoImg.src = 'https://i.postimg.cc/NfXT586g/IMG-3250.jpg';

  const DRINK_TYPES = ['martini', 'mojito', 'whiskey', 'beer', 'wine', 'shot', 'cocktail'];
  const DISH_TYPES = ['pasta', 'salad'];

  const game = {
    state: 'menu',
    score: 0,
    lives: 3,
    elapsed: 0,
    spawnTimer: 0,
    itemsSinceBomb: 0,
    nextBombAfter: 4,
    spawnInterval: 1.2,
    fallSpeed: 160,
    items: [],
    player: { x: 0, y: 0, w: 0, h: 0, targetX: 0 },
    highScore: parseInt(localStorage.getItem('chayka17_high') || '0', 10) || 0,
    lastTime: 0,
    gameOverTime: 0,
    lastLevel: 0
  };

  function resize() {
    dpr = window.devicePixelRatio || 1;
    lw = window.innerWidth;
    lh = window.innerHeight;
    W = canvas.width = Math.floor(lw * dpr);
    H = canvas.height = Math.floor(lh * dpr);
    canvas.style.width = lw + 'px';
    canvas.style.height = lh + 'px';

    game.player.w = Math.min(lw * 0.34, 170);
    game.player.h = 26;
    game.player.y = lh - 90;
    if (game.player.x === 0 && game.player.targetX === 0) {
      game.player.x = lw / 2 - game.player.w / 2;
      game.player.targetX = game.player.x;
    } else {
      game.player.x = Math.min(game.player.x, lw - game.player.w);
      game.player.targetX = Math.min(game.player.targetX, lw - game.player.w);
    }
  }

  function reset() {
    game.items = [];
    game.score = 0;
    game.lives = 3;
    game.elapsed = 0;
    game.spawnTimer = 0;
    game.spawnInterval = 1.2;
    game.fallSpeed = 160;
    game.itemsSinceBomb = 0;
    game.nextBombAfter = 3 + Math.floor(Math.random() * 3);
    game.player.w = Math.min(lw * 0.34, 170);
    game.player.h = 26;
    game.player.y = lh - 90;
    game.player.x = lw / 2 - game.player.w / 2;
    game.player.targetX = game.player.x;
    game.gameOverTime = 0;
    game.lastLevel = 0;
  }

  function start() {
    reset();
    game.state = 'playing';
    game.lastTime = performance.now();
  }

  function spawnItem() {
    game.itemsSinceBomb++;
    let isBomb = false;
    if (game.itemsSinceBomb >= game.nextBombAfter) {
      isBomb = true;
      game.itemsSinceBomb = 0;
      game.nextBombAfter = 3 + Math.floor(Math.random() * 3);
    }

    let type;
    if (isBomb) {
      type = 'bomb';
    } else if (Math.random() < 0.85) {
      type = DRINK_TYPES[Math.floor(Math.random() * DRINK_TYPES.length)];
    } else {
      type = DISH_TYPES[Math.floor(Math.random() * DISH_TYPES.length)];
    }

    const size = Math.min(lw * 0.15, 64);
    const x = Math.random() * (lw - size) + size / 2;
    const speedMul = 0.9 + Math.random() * 0.4;

    game.items.push({ x, y: -size, size, isBomb, speedMul, type, points: 1 });
  }

  function spawnGoldenSeagull() {
    const size = Math.min(lw * 0.28, 110);
    const x = Math.random() * (lw - size) + size / 2;
    game.items.push({
      x: x, y: -size, size: size,
      isBomb: false, speedMul: 0.6,
      type: 'seagull', points: 5
    });
  }

  function checkCollision(item) {
    const p = game.player;
    const half = item.size / 2;
    return (
      item.y + half > p.y &&
      item.y - half < p.y + p.h &&
      item.x + half > p.x &&
      item.x - half < p.x + p.w
    );
  }

  function update(dt) {
    if (game.state !== 'playing') return;

    game.elapsed += dt;

    const level = Math.floor(game.elapsed / 20);
    if (level > game.lastLevel) {
      game.lastLevel = level;
      spawnGoldenSeagull();
    }

    game.fallSpeed = 160 + level * 45;
    game.spawnInterval = Math.max(0.4, 1.2 - level * 0.1);

    game.spawnTimer += dt;
    if (game.spawnTimer >= game.spawnInterval) {
      game.spawnTimer -= game.spawnInterval;
      spawnItem();
    }

    for (let i = game.items.length - 1; i >= 0; i--) {
      const item = game.items[i];
      item.y += game.fallSpeed * item.speedMul * dt;

      if (checkCollision(item)) {
        game.items.splice(i, 1);
        if (item.isBomb) {
          game.lives--;
          if (game.lives <= 0) { gameOver(); return; }
        } else {
          game.score += (item.points || 1);
        }
        continue;
      }

      if (item.y - item.size / 2 > lh) {
        game.items.splice(i, 1);
      }
    }

    const dx = game.player.targetX - game.player.x;
    game.player.x += dx * Math.min(1, dt * 18);
  }

  function gameOver() {
    game.state = 'gameover';
    game.gameOverTime = 0;
    if (game.score > game.highScore) {
      game.highScore = game.score;
      try { localStorage.setItem('chayka17_high', String(game.score)); } catch(e) {}
    }
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(
      lw/2, lh * 0.42, 0,
      lw/2, lh * 0.42, Math.max(lw, lh) * 0.9
    );
    g.addColorStop(0, '#1a1306');
    g.addColorStop(0.35, '#0d0803');
    g.addColorStop(0.7, '#050301');
    g.addColorStop(1, '#000000');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, lw, lh);

    const v = ctx.createRadialGradient(
      lw/2, lh/2, Math.min(lw, lh) * 0.35,
      lw/2, lh/2, Math.max(lw, lh) * 0.75
    );
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, lw, lh);

    const top = ctx.createLinearGradient(0, 0, 0, lh * 0.4);
    top.addColorStop(0, 'rgba(212,175,55,0.06)');
    top.addColorStop(1, 'rgba(212,175,55,0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, lw, lh * 0.4);
  }

  function drawLogoImage(cx, cy, targetW, alpha) {
    if (!logoLoaded) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#D4AF37';
      ctx.font = `bold ${targetW * 0.35}px "Times New Roman", Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ЧАЙКА 17', cx, cy);
      ctx.restore();
      return;
    }
    const ratio = logoImg.naturalHeight / logoImg.naturalWidth;
    const drawW = targetW;
    const drawH = targetW * ratio;
    const x = cx - drawW / 2;
    const y = cy - drawH / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(212, 175, 55, 0.45)';
    ctx.shadowBlur = drawW * 0.12;
    ctx.drawImage(logoImg, x, y, drawW, drawH);
    ctx.restore();
  }

  function drawWatermark(alpha) {
    const cx = lw / 2;
    const cy = lh * 0.56;
    const fs = Math.min(lw * 0.15, 74);
    const ls = fs * 0.16;

    const text = 'ЧАЙКА 17';
    const chars = text.split('');

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `500 ${fs}px "Times New Roman", Georgia, serif`;

    const w = chars.map(function(c) { return ctx.measureText(c).width; });
    const totalW = w.reduce(function(a, b) { return a + b; }, 0) + ls * (chars.length - 1);
    const startX = cx - totalW / 2;

    const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 2200);

    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = Math.max(1, fs * 0.02);
    ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
    ctx.shadowBlur = fs * 0.22;

    let x = startX;
    for (let i = 0; i < chars.length; i++) {
      const cw = w[i];
      ctx.globalAlpha = alpha * pulse;
      ctx.strokeText(chars[i], x + cw / 2, cy);
      x += cw + ls;
    }

    ctx.shadowBlur = 0;
    const gap = fs * 0.5;
    const lineW = lw * 0.16;
    const leftStart = cx - totalW / 2 - gap - lineW;
    const rightEnd = cx + totalW / 2 + gap + lineW;

    const lg = ctx.createLinearGradient(leftStart, 0, rightEnd, 0);
    lg.addColorStop(0, 'rgba(212,175,55,0)');
    lg.addColorStop(0.35, 'rgba(212,175,55,' + (0.55 * alpha) + ')');
    lg.addColorStop(0.65, 'rgba(212,175,55,' + (0.55 * alpha) + ')');
    lg.addColorStop(1, 'rgba(212,175,55,0)');

    ctx.globalAlpha = 1;
    ctx.strokeStyle = lg;
    ctx.lineWidth = Math.max(1, fs * 0.012);
    ctx.beginPath();
    ctx.moveTo(leftStart, cy);
    ctx.lineTo(cx - totalW / 2 - gap, cy);
    ctx.moveTo(cx + totalW / 2 + gap, cy);
    ctx.lineTo(rightEnd, cy);
    ctx.stroke();

    ctx.globalAlpha = alpha * 0.7;
    ctx.fillStyle = '#D4AF37';
    const ds = Math.max(2, fs * 0.03);
    [leftStart, rightEnd].forEach(function(px) {
      ctx.beginPath();
      ctx.moveTo(px, cy - ds);
      ctx.lineTo(px + ds, cy);
      ctx.lineTo(px, cy + ds);
      ctx.lineTo(px - ds, cy);
      ctx.closePath();
      ctx.fill();
    });

    ctx.restore();
  }

  function drawPlayer() {
    const p = game.player;
    const r = p.h * 0.35;

    ctx.save();
    ctx.shadowColor = 'rgba(212, 175, 55, 0.55)';
    ctx.shadowBlur = 20;

    const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    g.addColorStop(0, '#3a2a12');
    g.addColorStop(0.4, '#1f1408');
    g.addColorStop(0.7, '#100a04');
    g.addColorStop(1, '#050301');
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(p.x + r, p.y);
    ctx.lineTo(p.x + p.w - r, p.y);
    ctx.quadraticCurveTo(p.x + p.w, p.y, p.x + p.w, p.y + r);
    ctx.lineTo(p.x + p.w, p.y + p.h - r);
    ctx.quadraticCurveTo(p.x + p.w, p.y + p.h, p.x + p.w - r, p.y + p.h);
    ctx.lineTo(p.x + r, p.y + p.h);
    ctx.quadraticCurveTo(p.x, p.y + p.h, p.x, p.y + p.h - r);
    ctx.lineTo(p.x, p.y + r);
    ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(p.x + r, p.y + 2.5);
    ctx.lineTo(p.x + p.w - r, p.y + 2.5);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x + 8, p.y + p.h * 0.5);
    ctx.lineTo(p.x + p.w - 8, p.y + p.h * 0.5);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x + 6, p.y + p.h - 3);
    ctx.lineTo(p.x + p.w - 6, p.y + p.h - 3);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  function drawMartini(x, y, r) {
    const s = r * 0.75;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.15);
    ctx.lineTo(x, y + s * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.55, y + s * 0.85);
    ctx.lineTo(x + s * 0.55, y + s * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.75, y - s * 0.7);
    ctx.lineTo(x + s * 0.75, y - s * 0.7);
    ctx.lineTo(x, y + s * 0.15);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.6, y - s * 0.55);
    ctx.lineTo(x + s * 0.6, y - s * 0.55);
    ctx.lineTo(x, y + s * 0.05);
    ctx.closePath();
    ctx.fillStyle = 'rgba(245, 215, 110, 0.35)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y - s * 0.35, s * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = '#7a8f2a';
    ctx.fill();
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + s * 0.15, y - s * 0.9);
    ctx.lineTo(x - s * 0.15, y - s * 0.1);
    ctx.strokeStyle = '#c9a94a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawMojito(x, y, r) {
    const s = r * 0.72;
    const cupTop = y - s * 0.7;
    const cupBot = y + s * 0.8;
    const cupL = x - s * 0.55;
    const cupR = x + s * 0.55;
    ctx.beginPath();
    ctx.rect(cupL, cupTop + s * 0.25, cupR - cupL, cupBot - cupTop - s * 0.25);
    ctx.fillStyle = 'rgba(200, 240, 180, 0.35)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cupL, cupTop);
    ctx.lineTo(cupL, cupBot);
    ctx.lineTo(cupR, cupBot);
    ctx.lineTo(cupR, cupTop);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(245, 215, 110, 0.6)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(cupL + s * 0.15, cupTop + s * 0.4, s * 0.3, s * 0.3);
    ctx.strokeRect(cupR - s * 0.45, cupTop + s * 0.55, s * 0.3, s * 0.3);
    ctx.fillStyle = '#4a8a3a';
    ctx.beginPath();
    ctx.arc(cupL + s * 0.3, cupTop + s * 0.2, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cupR - s * 0.35, cupTop + s * 0.25, s * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cupR - s * 0.2, cupTop);
    ctx.lineTo(cupR - s * 0.05, y - s * 1.1);
    ctx.strokeStyle = '#e8b93a';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawWhiskey(x, y, r) {
    const s = r * 0.72;
    const cupTop = y - s * 0.5;
    const cupBot = y + s * 0.7;
    const cupL = x - s * 0.65;
    const cupR = x + s * 0.65;
    ctx.beginPath();
    ctx.rect(cupL + 2, cupTop + s * 0.3, cupR - cupL - 4, cupBot - cupTop - s * 0.3 - 2);
    ctx.fillStyle = 'rgba(200, 120, 30, 0.65)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cupL, cupTop);
    ctx.lineTo(cupL, cupBot);
    ctx.lineTo(cupR, cupBot);
    ctx.lineTo(cupR, cupTop);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.35, cupTop + s * 0.45);
    ctx.lineTo(x - s * 0.05, cupTop + s * 0.4);
    ctx.lineTo(x - s * 0.05, cupTop + s * 0.7);
    ctx.lineTo(x - s * 0.35, cupTop + s * 0.75);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(245, 215, 110, 0.7)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawBeer(x, y, r) {
    const s = r * 0.75;
    const cupTop = y - s * 0.6;
    const cupBot = y + s * 0.75;
    const cupL = x - s * 0.45;
    const cupR = x + s * 0.45;

    ctx.beginPath();
    ctx.rect(cupL, cupTop + s * 0.25, cupR - cupL, cupBot - cupTop - s * 0.25);
    ctx.fillStyle = 'rgba(210, 150, 40, 0.7)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cupL, cupTop + s * 0.25);
    ctx.quadraticCurveTo(cupL + s * 0.15, cupTop - s * 0.05, cupL + s * 0.4, cupTop + s * 0.1);
    ctx.quadraticCurveTo(cupL + s * 0.6, cupTop - s * 0.1, cupR, cupTop + s * 0.25);
    ctx.closePath();
    ctx.fillStyle = 'rgba(250, 240, 200, 0.85)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cupL, cupTop + s * 0.2);
    ctx.lineTo(cupL, cupBot);
    ctx.lineTo(cupR, cupBot);
    ctx.lineTo(cupR, cupTop + s * 0.2);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cupR + s * 0.1, y + s * 0.15, s * 0.22, -Math.PI * 0.55, Math.PI * 0.55);
    ctx.stroke();
  }

  function drawWine(x, y, r) {
    const s = r * 0.8;

    ctx.beginPath();
    ctx.moveTo(x - s * 0.55, y - s * 0.7);
    ctx.quadraticCurveTo(x - s * 0.6, y - s * 0.05, x, y - s * 0.02);
    ctx.quadraticCurveTo(x + s * 0.6, y - s * 0.05, x + s * 0.55, y - s * 0.7);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.45, y - s * 0.35);
    ctx.quadraticCurveTo(x - s * 0.5, y - s * 0.05, x, y - s * 0.02);
    ctx.quadraticCurveTo(x + s * 0.5, y - s * 0.05, x + s * 0.45, y - s * 0.35);
    ctx.closePath();
    ctx.fillStyle = 'rgba(150, 25, 45, 0.7)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.02);
    ctx.lineTo(x, y + s * 0.65);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.42, y + s * 0.65);
    ctx.lineTo(x + s * 0.42, y + s * 0.65);
    ctx.stroke();
  }

  function drawShot(x, y, r) {
    const s = r * 0.72;

    ctx.beginPath();
    ctx.moveTo(x - s * 0.55, y - s * 0.6);
    ctx.lineTo(x + s * 0.55, y - s * 0.6);
    ctx.lineTo(x + s * 0.4, y + s * 0.75);
    ctx.lineTo(x - s * 0.4, y + s * 0.75);
    ctx.closePath();

    ctx.fillStyle = 'rgba(230, 180, 40, 0.7)';
    ctx.fill();
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.55, y - s * 0.6);
    ctx.lineTo(x + s * 0.55, y - s * 0.6);
    ctx.strokeStyle = '#F9E9A8';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.3, y - s * 0.4);
    ctx.lineTo(x - s * 0.25, y + s * 0.5);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawCocktail(x, y, r) {
    const s = r * 0.75;

    ctx.beginPath();
    ctx.moveTo(x - s * 0.6, y - s * 0.55);
    ctx.quadraticCurveTo(x - s * 0.65, y + s * 0.1, x, y + s * 0.2);
    ctx.quadraticCurveTo(x + s * 0.65, y + s * 0.1, x + s * 0.6, y - s * 0.55);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y - s * 0.3);
    ctx.quadraticCurveTo(x - s * 0.55, y + s * 0.08, x, y + s * 0.15);
    ctx.quadraticCurveTo(x + s * 0.55, y + s * 0.08, x + s * 0.5, y - s * 0.3);
    ctx.closePath();
    ctx.fillStyle = 'rgba(220, 60, 90, 0.6)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.2);
    ctx.lineTo(x, y + s * 0.7);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.35, y + s * 0.7);
    ctx.lineTo(x + s * 0.35, y + s * 0.7);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + s * 0.3, y - s * 0.45);
    ctx.lineTo(x + s * 0.55, y - s * 0.95);
    ctx.strokeStyle = '#e8b93a';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x - s * 0.35, y - s * 0.6, s * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#7a8f2a';
    ctx.fill();
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  function drawPasta(x, y, r) {
    const s = r * 0.85;

    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.35, s * 0.85, s * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
    ctx.fill();
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.3, s * 0.65, s * 0.2, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(245, 215, 110, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const pastaColor = '#e8c060';
    ctx.strokeStyle = pastaColor;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';

    for (let i = 0; i < 5; i++) {
      const offset = (i - 2) * s * 0.18;
      ctx.beginPath();
      ctx.moveTo(x - s * 0.5, y - s * 0.05 + offset * 0.3);
      ctx.bezierCurveTo(
        x - s * 0.25, y - s * 0.4 + offset * 0.5,
        x + s * 0.25, y + s * 0.1 + offset * 0.5,
        x + s * 0.5, y - s * 0.15 + offset * 0.3
      );
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(200, 40, 30, 0.7)';
    ctx.beginPath();
    ctx.arc(x - s * 0.25, y - s * 0.15, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + s * 0.2, y - s * 0.05, s * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y + s * 0.15, s * 0.09, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5a9a3a';
    ctx.beginPath();
    ctx.ellipse(x - s * 0.1, y - s * 0.35, s * 0.1, s * 0.05, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + s * 0.25, y - s * 0.3, s * 0.09, s * 0.045, 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 240, 180, 0.9)';
    ctx.beginPath();
    ctx.arc(x + s * 0.35, y + s * 0.05, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x - s * 0.4, y + s * 0.1, s * 0.045, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.35, s * 0.85, s * 0.28, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }

  function drawSalad(x, y, r) {
    const s = r * 0.85;

    ctx.beginPath();
    ctx.arc(x, y + s * 0.1, s * 0.75, 0, Math.PI);
    ctx.fillStyle = 'rgba(212, 175, 55, 0.18)';
    ctx.fill();
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.1, s * 0.75, s * 0.18, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#4a8a3a';
    ctx.beginPath();
    ctx.arc(x - s * 0.35, y - s * 0.05, s * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + s * 0.3, y - s * 0.1, s * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x - s * 0.05, y - s * 0.25, s * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6ab84a';
    ctx.beginPath();
    ctx.arc(x - s * 0.2, y - s * 0.15, s * 0.14, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + s * 0.15, y - s * 0.2, s * 0.13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#c43a2a';
    ctx.beginPath();
    ctx.arc(x - s * 0.4, y + s * 0.1, s * 0.11, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + s * 0.35, y + s * 0.05, s * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y + s * 0.15, s * 0.09, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(x - s * 0.43, y + s * 0.07, s * 0.03, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + s * 0.32, y + s * 0.02, s * 0.028, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8fbf4a';
    ctx.beginPath();
    ctx.ellipse(x - s * 0.05, y + s * 0.05, s * 0.14, s * 0.06, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + s * 0.2, y + s * 0.15, s * 0.12, s * 0.05, -0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.1, s * 0.75, s * 0.18, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#F5D76E';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawBomb(x, y, r) {
    const s = r * 0.7;
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fillStyle = '#1a0505';
    ctx.fill();
    ctx.strokeStyle = '#ff3030';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y - s * 0.5);
    ctx.lineTo(x + s * 0.5, y + s * 0.5);
    ctx.moveTo(x + s * 0.5, y - s * 0.5);
    ctx.lineTo(x - s * 0.5, y + s * 0.5);
    ctx.strokeStyle = '#ff5050';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawGoldenSeagull(x, y, r) {
    const s = r * 0.95;

    ctx.save();

    ctx.shadowColor = 'rgba(245, 215, 110, 0.95)';
    ctx.shadowBlur = 35;

    const grad = ctx.createLinearGradient(x, y - s * 0.6, x, y + s * 0.6);
    grad.addColorStop(0, '#FFF8D8');
    grad.addColorStop(0.3, '#F9E9A8');
    grad.addColorStop(0.6, '#D4AF37');
    grad.addColorStop(1, '#8B6A1E');

    ctx.beginPath();
    ctx.moveTo(x - s * 0.05, y - s * 0.05);
    ctx.quadraticCurveTo(x - s * 0.5, y - s * 0.75, x - s * 1.0, y - s * 0.35);
    ctx.quadraticCurveTo(x - s * 0.75, y - s * 0.15, x - s * 0.55, y + s * 0.1);
    ctx.quadraticCurveTo(x - s * 0.35, y + s * 0.05, x - s * 0.05, y - s * 0.05);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + s * 0.05, y - s * 0.05);
    ctx.quadraticCurveTo(x + s * 0.5, y - s * 0.75, x + s * 1.0, y - s * 0.35);
    ctx.quadraticCurveTo(x + s * 0.75, y - s * 0.15, x + s * 0.55, y + s * 0.1);
    ctx.quadraticCurveTo(x + s * 0.35, y + s * 0.05, x + s * 0.05, y - s * 0.05);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x, y + s * 0.15, s * 0.32, s * 0.16, 0, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x + s * 0.08, y + s * 0.12, s * 0.18, s * 0.12, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFF3C0';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x + s * 0.32, y - s * 0.02, s * 0.14, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(x + s * 0.36, y - s * 0.05, s * 0.025, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1306';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + s * 0.42, y - s * 0.06);
    ctx.lineTo(x + s * 0.62, y - s * 0.01);
    ctx.lineTo(x + s * 0.42, y + s * 0.04);
    ctx.closePath();
    ctx.fillStyle = '#F5D76E';
    ctx.fill();
    ctx.strokeStyle = '#8B6A1E';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - s * 0.25, y + s * 0.12);
    ctx.lineTo(x - s * 0.6, y + s * 0.4);
    ctx.lineTo(x - s * 0.55, y + s * 0.15);
    ctx.lineTo(x - s * 0.65, y + s * 0.32);
    ctx.lineTo(x - s * 0.28, y + s * 0.22);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = '#8B6A1E';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.05, y + s * 0.28);
    ctx.lineTo(x - s * 0.12, y + s * 0.42);
    ctx.moveTo(x + s * 0.05, y + s * 0.28);
    ctx.lineTo(x + s * 0.02, y + s * 0.42);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255, 245, 200, 0.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.15, y - s * 0.15);
    ctx.quadraticCurveTo(x - s * 0.4, y - s * 0.45, x - s * 0.75, y - s * 0.32);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + s * 0.15, y - s * 0.15);
    ctx.quadraticCurveTo(x + s * 0.4, y - s * 0.45, x + s * 0.75, y - s * 0.32);
    ctx.stroke();

    ctx.shadowColor = 'rgba(245, 215, 110, 0.95)';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#FFF3C0';
    ctx.font = `bold ${s * 0.6}px "Times New Roman", Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+5', x, y + s * 0.8);

    ctx.restore();
  }

  function drawItem(item) {
    if (item.type === 'seagull') {
      drawGoldenSeagull(item.x, item.y, item.size * 0.5);
      return;
    }

    ctx.save();

    const r = item.size * 0.5;
    ctx.beginPath();
    ctx.arc(item.x, item.y, r, 0, Math.PI * 2);
    ctx.shadowColor = item.isBomb ? 'rgba(255, 60, 60, 0.8)' : 'rgba(212, 175, 55, 0.7)';
    ctx.shadowBlur = 14;
    if (item.isBomb) {
      ctx.fillStyle = '#2a0505';
      ctx.strokeStyle = '#ff3030';
    } else {
      ctx.fillStyle = '#1a1208';
      ctx.strokeStyle = '#D4AF37';
    }
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = item.isBomb ? '#ff6060' : '#F5D76E';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (item.type === 'martini') drawMartini(item.x, item.y, r);
    else if (item.type === 'mojito') drawMojito(item.x, item.y, r);
    else if (item.type === 'whiskey') drawWhiskey(item.x, item.y, r);
    else if (item.type === 'beer') drawBeer(item.x, item.y, r);
    else if (item.type === 'wine') drawWine(item.x, item.y, r);
    else if (item.type === 'shot') drawShot(item.x, item.y, r);
    else if (item.type === 'cocktail') drawCocktail(item.x, item.y, r);
    else if (item.type === 'pasta') drawPasta(item.x, item.y, r);
    else if (item.type === 'salad') drawSalad(item.x, item.y, r);
    else if (item.isBomb) drawBomb(item.x, item.y, r);

    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    ctx.fillStyle = '#D4AF37';
    ctx.font = 'bold 20px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
    ctx.shadowBlur = 8;
    ctx.fillText('Очки: ' + game.score, 18, 18);

    ctx.textAlign = 'right';
    ctx.fillText('❤'.repeat(Math.max(0, game.lives)), lw - 18, 18);

    const level = Math.floor(game.elapsed / 20) + 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(212, 175, 55, 0.65)';
    ctx.font = '14px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('Уровень ' + level, lw/2, 22);

    ctx.restore();
  }

  function drawMenu() {
    drawBackground();
    drawLogoImage(lw/2, lh * 0.18, lw * 0.35, 1);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const fs = Math.min(lw * 0.1, 42);
    ctx.font = `600 ${fs}px "Times New Roman", Georgia, serif`;
    const grad = ctx.createLinearGradient(0, lh * 0.38 - fs * 0.5, 0, lh * 0.38 + fs * 0.5);
    grad.addColorStop(0, '#F9E9A8');
    grad.addColorStop(0.5, '#D4AF37');
    grad.addColorStop(1, '#7A5E1A');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
    ctx.shadowBlur = 14;
    ctx.fillText('Ч А Й К А   1 7', lw/2, lh * 0.39);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(212, 175, 55, 0.85)';
    ctx.font = `300 ${Math.min(lw * 0.032, 13)}px "Times New Roman", Georgia, serif`;
    ctx.fillText('Л О В К А Я   С Т О Й К А   Б А Р А', lw/2, lh * 0.39 + Math.min(lw * 0.08, 40));

    ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(lw/2 - lw * 0.18, lh * 0.39 + Math.min(lw * 0.12, 60));
    ctx.lineTo(lw/2 + lw * 0.18, lh * 0.39 + Math.min(lw * 0.12, 60));
    ctx.stroke();

    ctx.fillStyle = 'rgba(245, 215, 110, 0.8)';
    ctx.font = `300 ${Math.min(lw * 0.038, 15)}px "Times New Roman", Georgia, serif`;
    ctx.fillText('Ловите коктейли и напитки', lw/2, lh * 0.62);
    ctx.fillText('Избегайте бомб', lw/2, lh * 0.62 + 26);
    ctx.fillStyle = 'rgba(212, 175, 55, 0.55)';
    ctx.font = `300 ${Math.min(lw * 0.034, 13)}px "Times New Roman", Georgia, serif`;
    ctx.fillText('Три жизни  ·  Игра бесконечна', lw/2, lh * 0.62 + 54);

    if (game.highScore > 0) {
      ctx.fillStyle = 'rgba(212, 175, 55, 0.85)';
      ctx.font = `500 ${Math.min(lw * 0.045, 18)}px "Times New Roman", Georgia, serif`;
      ctx.fillText('РЕКОРД  ·  ' + game.highScore, lw/2, lh * 0.79);
    }

    ctx.fillStyle = '#F5D76E';
    ctx.font = `500 ${Math.min(lw * 0.045, 18)}px "Times New Roman", Georgia, serif`;
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 450);
    ctx.globalAlpha = pulse;
    ctx.fillText('К О С Н И Т Е С Ь   Э К Р А Н А', lw/2, lh * 0.92);

    ctx.restore();
  }

  function drawGameOver() {
    drawBackground();
    drawLogoImage(lw/2, lh * 0.15, lw * 0.25, 0.75);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#D4AF37';
    ctx.font = `600 ${Math.min(lw * 0.075, 34)}px "Times New Roman", Georgia, serif`;
    ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
    ctx.shadowBlur = 14;
    ctx.fillText('И Г Р А   О К О Н Ч Е Н А', lw/2, lh * 0.36);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#F5D76E';
    ctx.font = `600 ${Math.min(lw * 0.13, 56)}px "Times New Roman", Georgia, serif`;
    ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
    ctx.shadowBlur = 18;
    ctx.fillText(String(game.score), lw/2, lh * 0.5);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(212, 175, 55, 0.7)';
    ctx.font = `300 ${Math.min(lw * 0.032, 13)}px "Times New Roman", Georgia, serif`;
    ctx.fillText('О Ч К О В', lw/2, lh * 0.5 + Math.min(lw * 0.09, 40));

    if (game.score > 0 && game.score >= game.highScore) {
      ctx.fillStyle = '#D4AF37';
      ctx.font = `500 ${Math.min(lw * 0.045, 18)}px "Times New Roman", Georgia, serif`;
      ctx.fillText('Н О В Ы Й   Р Е К О Р Д', lw/2, lh * 0.64);
    } else {
      ctx.fillStyle = 'rgba(212, 175, 55, 0.65)';
      ctx.font = `300 ${Math.min(lw * 0.04, 16)}px "Times New Roman", Georgia, serif`;
      ctx.fillText('Рекорд  ·  ' + game.highScore, lw/2, lh * 0.64);
    }

    ctx.fillStyle = '#F5D76E';
    ctx.font = `500 ${Math.min(lw * 0.045, 18)}px "Times New Roman", Georgia, serif`;
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 450);
    ctx.globalAlpha = pulse;
    ctx.fillText('И Г Р А Т Ь   С Н О В А', lw/2, lh * 0.82);

    ctx.restore();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (game.state === 'menu') {
      drawMenu();
    } else if (game.state === 'playing') {
      drawBackground();
      drawLogoImage(lw/2, lh * 0.38, lw * 0.28, 0.16);
      drawWatermark(0.4);
      for (const item of game.items) drawItem(item);
      drawPlayer();
      drawHUD();
    } else if (game.state === 'gameover') {
      drawGameOver();
    }
  }

  function loop(now) {
    const dt = Math.min((now - game.lastTime) / 1000, 0.05);
    game.lastTime = now;
    if (game.state === 'gameover') game.gameOverTime += dt;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function movePlayerTo(x) {
    if (game.state !== 'playing') return;
    game.player.targetX = x - game.player.w / 2;
    game.player.targetX = Math.max(0, Math.min(lw - game.player.w, game.player.targetX));
  }

  function handleTap(x, y) {
    if (game.state === 'menu') start();
    else if (game.state === 'gameover') { if (game.gameOverTime > 0.7) start(); }
    else if (game.state === 'playing') movePlayerTo(x);
  }

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault(); const p = getPos(e); handleTap(p.x, p.y);
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault(); const p = getPos(e); movePlayerTo(p.x);
  }, { passive: false });

  canvas.addEventListener('mousedown', function(e) {
    const p = getPos(e); handleTap(p.x, p.y);
  });

  canvas.addEventListener('mousemove', function(e) {
    if (e.buttons) { const p = getPos(e); movePlayerTo(p.x); }
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });

  resize();
  reset();
  game.state = 'menu';
  game.lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js')
        .then(function(registration) {
          console.log('Service Worker зарегистрирован:', registration.scope);
        })
        .catch(function(error) {
          console.log('Ошибка регистрации Service Worker:', error);
        });
    });
  }
</script>
